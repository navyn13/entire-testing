<title>Hello</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap">
<style>
  /* Layout: one centered-left column, a large greeting, a quiet row of hellos beneath */
  :root {
    --bg: #eef2f6;
    --surface: #ffffff;
    --fg: #16202b;
    --muted: #5b6b7c;
    --accent: #2f6fd6;
    --line: #d5dde6;
    --display: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
    --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f151c; --surface: #17202a; --fg: #e6edf4; --muted: #93a3b4;
      --accent: #6fa3f5; --line: #2a3644; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f151c; --surface: #17202a; --fg: #e6edf4; --muted: #93a3b4;
    --accent: #6fa3f5; --line: #2a3644; color-scheme: dark;
  }

  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.6;
    display: grid;
    place-items: center;
    padding-block: 3rem;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    box-sizing: border-box;
  }
  main {
    width: 100%;
    max-width: 36rem;
    display: grid;
    gap: 1.5rem;
  }
  .eyebrow {
    margin: 0;
    font-size: 0.8rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  h1 {
    margin: 0;
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(3rem, 12vw, 5.5rem);
    line-height: 1;
    letter-spacing: -0.03em;
    text-wrap: balance;
  }
  h1 span { color: var(--accent); }
  .lede {
    margin: 0;
    color: var(--muted);
    max-width: 32rem;
  }
  ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
  }
  li {
    display: inline-flex;
    align-items: baseline;
    gap: 0.4rem;
    padding: 0.35rem 0.75rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    font-size: 0.95rem;
  }
  li small {
    font-size: 0.7rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }
  time { font-variant-numeric: tabular-nums; }
</style>

<main>
  <p class="eyebrow" id="when">Good day · <time id="clock">--:--</time></p>
  <h1>Hello<span>.</span></h1>
  <p class="lede">A small page that says hi. Here's the same word in a few other languages.</p>
  <ul>
    <li>Hola <small>es</small></li>
    <li>Bonjour <small>fr</small></li>
    <li>Namaste <small>hi</small></li>
    <li>Hallo <small>de</small></li>
    <li>Ciao <small>it</small></li>
    <li>Konnichiwa <small>ja</small></li>
    <li>Olá <small>pt</small></li>
  </ul>
</main>

<script>
  function tick() {
    const now = new Date();
    const h = now.getHours();
    const part = h < 5 ? "Good night" : h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening";
    const time = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    document.getElementById("when").innerHTML = part + ' · <time id="clock">' + time + "</time>";
  }
  tick();
  setInterval(tick, 30000);
</script>
